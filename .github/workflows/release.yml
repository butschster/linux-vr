# Build both halves on a version tag and attach them to a release.
#
# Both halves, on purpose: a server binary without the matching app is useless,
# and the pair being built from one commit is the only guarantee that the wire
# between them agrees.
name: release

on:
  push:
    tags:
      - "v*"
  # Buildable on demand as well, so a broken workflow is found without cutting
  # a tag to test it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # Nothing to cache: the server has no dependencies outside the
          # standard library, so there is no go.sum for the cache to key on.
          cache: false

      - name: Vet
        run: cd host && go vet ./...

      # Static, for both architectures a Linux desktop is plausibly on. CGO off
      # is what makes the binary run on a distribution older than this runner.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "linux-vr-server-linux-$arch" ./cmd/linux-vr-server
          done
        working-directory: host

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: host/linux-vr-server-linux-*

  client:
    runs-on: ubuntu-latest
    # At job level so the steps below can branch on whether it is set: the
    # secrets context is not available in a step's own `if`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The key has to be stable across releases: Android refuses to install an
      # update signed by a different key than the installed copy, and a debug
      # keystore is generated per machine. Without the secrets the build still
      # works — it falls back to a debug key, and the APK it produces cannot
      # upgrade an existing install.
      - name: Restore the signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd client
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release*.apk ../linux-vr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: linux-vr.apk

  publish:
    needs: [server, client]
    runs-on: ubuntu-latest
    # Only a tag becomes a release; a manual run just leaves the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-vr-server-linux-*
            linux-vr.apk
          generate_release_notes: true
          body: |
            ## The Linux machine

            ```sh
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/linux-vr-server-linux-amd64 \
                -o /usr/local/bin/linux-vr-server && chmod +x /usr/local/bin/linux-vr-server
            linux-vr-server doctor
            linux-vr-server
            ```

            It needs `ffmpeg` with VAAPI, membership of the `input` group for
            `/dev/uinput`, and a password-less sudo rule for `ffmpeg` because
            `kmsgrab` requires `CAP_SYS_ADMIN`. `doctor` says which is missing.

            ## The headset

            ```sh
            adb install -r linux-vr.apk
            ```

            The machine you installed the server on is already in the list.
